<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tung Assistant - Callback</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:4rem auto;padding:0 1rem}textarea{width:100%;height:6rem;font-family:monospace}</style></head>
<body><h1>Authorization code</h1><p id="msg"></p><textarea id="code" readonly></textarea><p><button id="copy">Copy</button></p>
<script>
var p=new URLSearchParams(location.search);var c=p.get('code');var e=p.get('error');
document.getElementById('code').value=c||'';
document.getElementById('msg').textContent=c?'Copy this code and paste it back to your assistant.':(e?('Error: '+e+' '+(p.get('error_description')||'')):'No code found in the URL.');
document.getElementById('copy').onclick=function(){var t=document.getElementById('code');t.select();navigator.clipboard?navigator.clipboard.writeText(t.value):document.execCommand('copy');};
</script></body></html>
